name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      TETHER_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "TETHER_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Detekt
        run: ./gradlew --stacktrace detekt
      - name: Unit tests (core + app, Robolectric)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest
      - name: Android lint
        run: ./gradlew --stacktrace :app:lintDebug
      - name: Build APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease
      - name: Screenshots (Roborazzi)
        run: ./gradlew --stacktrace :app:recordRoborazziDebug
      - name: Collect
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/Tether-${TETHER_VERSION_NAME}.apk"
          ls -la ../out ../docs/screenshots/android || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            out/*.apk
            docs/screenshots/android/*.png
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/build/reports
            android/core/build/reports
            android/app/build/reports
            android/app/build/outputs/roborazzi
      - name: Commit screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/android
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update Android screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  emulator:
    name: Android emulator (instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space (the emulator needs ~7 GB for userdata)
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Instrumented tests (reply path, MediaStore watcher) on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports
          path: android/app/build/reports/androidTests

  interop:
    name: Interop (Kotlin ↔ Swift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TETHER_CORE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Swift toolchain
        run: |
          if ! command -v swift >/dev/null; then
            curl -fsSL https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu24.04.tar.gz | tar xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/swift-6.0.3-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Build the Swift peer (real TetherCore)
        working-directory: tools/interop
        run: swift --version && swift build
      - name: Kotlin phone core ↔ Swift Mac core
        working-directory: android
        run: |
          export TETHER_SWIFT_PEER="$GITHUB_WORKSPACE/tools/interop/.build/debug/tether-peer"
          ./gradlew --stacktrace :core:test --tests '*InteropTest*'
          # Fail if the tests were skipped (peer not found) instead of silently passing.
          f=core/build/test-results/test/TEST-dev.benfranklin.tether.core.InteropTest.xml
          grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          grep -q 'skipped="0" failures="0" errors="0"' "$f"
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-reports
          path: android/core/build/reports

  mac:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mac
    env:
      APP: build/Build/Products/Release/Tether.app
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen swiftlint
          xcodebuild -version
          swift --version
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "TETHER_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: TetherCore tests
        working-directory: mac/TetherCore
        run: swift test
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (universal, Release)
        run: |
          set -o pipefail
          xcodebuild -project Tether.xcodeproj -scheme Tether -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$TETHER_VERSION_NAME" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log | grep -E "error:|warning: .*Tether/|BUILD (SUCCEEDED|FAILED)" || true
          test -x "$APP/Contents/MacOS/Tether" || { grep -E "error:" -A3 xcodebuild.log | head -150; exit 1; }
      - name: Liquid Glass compiled in
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk"
          if nm -u "$APP/Contents/MacOS/Tether" | grep -q glassEffect; then
            echo "Liquid Glass APIs (glassEffect) are linked"
          elif [ "${sdk%%.*}" -ge 26 ]; then
            echo "SDK $sdk has Liquid Glass but the binary does not reference glassEffect"; exit 1
          else
            echo "SDK $sdk predates macOS 26: Liquid Glass is compiled out (material fallback only)"
          fi
      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Tether"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
      - name: Package zip + dmg
        run: |
          mkdir -p ../out dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" "../out/Tether-${TETHER_VERSION_NAME}.zip"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Tether" -srcfolder dmg -ov -format UDZO "../out/Tether-${TETHER_VERSION_NAME}.dmg"
          ls -la ../out
      - name: Screenshots (demo mode)
        continue-on-error: true
        run: |
          mkdir -p ../docs/screenshots/mac
          "$APP/Contents/MacOS/Tether" --screenshots "$PWD/../docs/screenshots/mac" &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la ../docs/screenshots/mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            out/*.zip
            out/*.dmg
            docs/screenshots/mac/*.png
      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-logs
          path: mac/xcodebuild.log
      - name: Commit screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/mac || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update macOS screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  release:
    name: Release
    needs: [android, mac, interop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          find dist -type f | sort
          files=$(find dist -type f \( -name "Tether-$v.apk" -o -name "Tether-$v.dmg" -o -name "Tether-$v.zip" \))
          test "$(echo "$files" | wc -l)" -eq 3 || { echo "expected 3 assets, got: $files"; exit 1; }
          cat > notes.md <<NOTES
          Tether $v: Android phone ↔ Mac clipboard, notifications and files over Bluetooth LE (+ Wi-Fi fast path), end-to-end encrypted with Noise XX.

          - **Android**: \`Tether-$v.apk\` (Android 8.0+). Signed with the repo's committed key, see README.
          - **macOS**: \`Tether-$v.dmg\` or \`Tether-$v.zip\` (macOS 13+, universal). Ad-hoc signed, not notarized: right-click → Open the first time, or run \`xattr -dr com.apple.quarantine /Applications/Tether.app\`.

          Built by CI and not yet tested on real devices. See README → Limitations.
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "Tether $v" --notes-file notes.md
          fi
