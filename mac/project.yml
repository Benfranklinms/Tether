name: Tether
options:
  bundleIdPrefix: in.benfranklin
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  TetherCore:
    path: TetherCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.4.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tether:
    type: application
    platform: macOS
    sources:
      - path: Tether
    dependencies:
      - package: TetherCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.benfranklin.tether.mac
        PRODUCT_NAME: Tether
        INFOPLIST_FILE: Tether/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
schemes:
  Tether:
    build:
      targets:
        Tether: all
    run:
      config: Debug
    archive:
      config: Release
